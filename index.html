<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProjectPay Tracker</title>
    <meta name="description" content="Simple personal freelance work tracker for hours, payments, reminders, and estimated tax savings." />
    <meta property="og:title" content="ProjectPay Tracker" />
    <meta property="og:description" content="Simple personal freelance work tracker for hours, payments, reminders, and estimated tax savings." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('projectpay_tracker_settings_v1');
          var settings = raw ? JSON.parse(raw) : {};
          var theme = settings.theme || 'system';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
